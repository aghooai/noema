# Grafana file provisioning for the Noema dashboards (docs/operations/observability.md "Grafana"). Mount
# deploy/observability/grafana/dashboards at the path below and this file under /etc/grafana/provisioning/dashboards/.
apiVersion: 1
providers:
  - name: noema
    folder: Noema
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/noema
