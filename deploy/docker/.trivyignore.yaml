  - {id: CVE-2026-6653, expired_at: 2027-01-09, statement: "libxml2 (CRITICAL): use-after-free in DTD parsing (xmlParseInternalSubset); the only process that loads the system libxml2 is the jailed tesseract child (through libarchive and libtesseract), which parses XML only when libarchive opens a XAR archive; tesseract reads a Pillow-written PNG on stdin and its tessdata from the read-only image, so no uploaded byte reaches libxml2; the Python stack does not link it. No fixed version in Debian 12."}
  - {id: CVE-2026-74860, expired_at: 2027-01-09, statement: "libxml2: double free in the libxml2 Python bindings; the bindings (python3-libxml2) are not installed. No fixed version in Debian 12."}
