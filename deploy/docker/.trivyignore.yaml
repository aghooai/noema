# Waivers of the image CVEs with no fixed version (defect 29, SE13; spec-09 §9 SEC-SC-01). Owner: infra.
# Read by trivy (`make image-scan`: --ignorefile; an entry past its `expired_at` no longer applies, so the gate fails
# again until the entry is reviewed) and by `python -m tests.security.sca_gate <scan dir> deploy/docker/.trivyignore.yaml`
# (one entry per line: the id and the review date on the same line; statements hold no other id and no date).
# Images: noema-api and noema-worker (debian:trixie-slim, Debian 13, + the python-build-standalone CPython that uv
# installs in /opt/python, Wave F); noema-media (python:3.12-slim-bookworm, Debian 12, the latest point release, +
# tesseract, libmagic, qpdf; see media-sandbox.Dockerfile for why bookworm). The standalone CPython links its own
# OpenSSL, SQLite, zlib, expat, libffi, xz, bzip2, ncurses and libedit statically: trivy's Debian scan cannot see
# them, so they are reviewed with each PYTHON_VERSION / UV_IMAGE bump in api.Dockerfile, not here.
# Runtime facts the statements rely on: api/worker run as uid 10001 with no-new-privileges, cap_drop ALL and a
# read-only root; media-sandbox runs sandboxd as root with no-new-privileges and network_mode none, and every
# extraction runs in nsjail (user, net, pid and mount namespaces, uid 65534 inside, no_new_privs, seccomp, rlimits).
# The OCR child is `tesseract - stdout` fed the `raster` derivative, a PNG written by Pillow in image.normalize.
# Process: re-scan at least at each review date; drop an entry once Debian ships a fix (apt-get upgrade in the build
# picks it up) or the package leaves the image.
vulnerabilities:
  # --- every image ------------------------------------------------------------------------------------------------
  - {id: CVE-2025-69720, expired_at: 2027-01-09, statement: "ncurses (libncursesw6 in noema-media only, libtinfo6, ncurses-base, ncurses-bin): stack overflow in the infocmp command-line tool only; no Noema process runs infocmp (the libraries serve the shell and, in noema-media, Python's unused curses/readline modules). No fixed version in Debian 12 or 13."}
  - {id: CVE-2026-16742, expired_at: 2027-01-09, statement: "systemd (libsystemd0, libudev1): privilege escalation in systemd-homed; no container runs systemd or homed, the libraries are only dependencies of apt and util-linux. No fixed version in Debian 12 or 13."}
  - {id: CVE-2026-54369, expired_at: 2027-01-09, statement: "libacl1: symlink traversal when a privileged caller runs the libacl pathname functions on attacker-influenced paths; no Noema code path calls libacl (Python does not; it serves coreutils, tar and libarchive, which tesseract uses only to read its own tessdata). No fixed version in Debian 12 or 13."}
  - {id: CVE-2026-76642, expired_at: 2027-01-09, statement: "util-linux (mount, libmount and the other util-linux packages): X-mount post-hooks after a failed helper, reachable only through mount(8) and fstab; no Noema process mounts through libmount (nsjail mounts with raw syscalls and does not link it), there is no fstab entry, and no-new-privileges voids the SUID bit. No fixed version in Debian 12 or 13."}
  - {id: CVE-2026-78408, expired_at: 2027-01-09, statement: "util-linux: nsenter --join-cgroup keeps a root-opened cgroup.procs descriptor; no Noema process runs nsenter and every container runs with no-new-privileges. No fixed version in Debian 12 or 13."}
  - {id: CVE-2026-78409, expired_at: 2027-01-09, statement: "util-linux: X-mount.subdir symlink escape for a user with an fstab-authorized entry; there is no fstab entry, no Noema process runs mount(8) or links libmount, and no-new-privileges voids the SUID bit. No fixed version in Debian 12 or 13."}
  - {id: CVE-2026-78410, expired_at: 2027-01-09, statement: "util-linux: restricted bind mounts do not pin the fstab source; there is no fstab entry, no Noema process runs mount(8) or links libmount, and no-new-privileges voids the SUID bit. No fixed version in Debian 12 or 13."}
  - {id: CVE-2026-9538, expired_at: 2027-01-09, statement: "perl-base: Archive::Tar memory exhaustion on a crafted tar header; no Noema process runs Perl (perl-base serves dpkg and debconf at build time). No fixed version in Debian 12 or 13 (fix deferred)."}
