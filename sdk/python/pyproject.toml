[project]
name = "aghoo"
version = "0.3.0"
description = "Python client for the Noema API (decisions, turns, sessions, files, usage); every model call runs on Amazon Bedrock."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "anyio>=4,<5",  # imported directly: async retry backoff, stream abort events, worker-thread file reads
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aghoo"]

# The tests run in the Noema repo's root venv (httpx, pydantic, respx, jsonschema, pytest, anyio are pinned there):
#   UV_NO_SYNC=1 uv run --frozen --no-sync pytest sdk/python -q
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "--disable-socket",
           "--allow-hosts=127.0.0.1,::1", "-p", "anyio"]
timeout = 60
markers = [
  "unit: pure in-process tests (no network)",
  "live: real calls against a Noema deployment; needs NOEMA_LIVE=1",
]
xfail_strict = true

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]
extend-exclude = ["src/aghoo/_decision_types.py"]  # byte copy of contracts/python_sdk_types.py

[tool.ruff.lint.isort]
known-first-party = ["aghoo", "support"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aghoo", "tests"]
mypy_path = "src:tests"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["aghoo._decision_types"]   # vendored contract file: typed for importers, not linted itself
ignore_errors = true

[[tool.mypy.overrides]]
module = ["noema.*", "pytest_socket.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
