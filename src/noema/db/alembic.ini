# Alembic configuration of the noema schema (spec-03 §7). Run as noema_owner only:
#   NOEMA_DB_OWNER_DSN=postgresql://noema_owner:...@host/db alembic -c src/noema/db/alembic.ini upgrade head
# (or `make db-migrate`). Revision ids are NNNN_<slug>; files are versions/rNNNN_<slug>.py with their SQL in
# sql/NNNN_<slug>/*.sql. Create one with: alembic -c src/noema/db/alembic.ini revision --rev-id 0002_<slug> -m "<slug>"
[alembic]
script_location = %(here)s/alembic
file_template = r%%(rev)s
path_separator = os
