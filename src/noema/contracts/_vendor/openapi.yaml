  /v1/files:
    post:
      tags: [files]
      operationId: uploadFile
      summary: Upload a file (validated and extracted asynchronously)
      x-noema-roles: [tenant_admin, developer, end_user]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AghooVersion'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/EndUser'
      requestBody:
        required: true
        description: |
          The body is streamed, and `session_id` is authorized before any byte of the file is stored: send the `purpose`
          and `session_id` parts before the `file` part. A `session_id` part after `file` is 400 `schema_violation`
          (`param: session_id`).
          The `file` part's Content-Type (parameters such as `; charset` ignored) must be one of the types listed in
          its encoding, and its filename must have one of the accepted extensions (`.png`, `.jpg`, `.jpeg`, `.webp`,
          `.gif`, `.heic`, `.heif`, `.pdf`, `.md`, `.markdown`); otherwise the upload is 415 `unsupported_media_type`
          before any byte is stored. A generic type such as `application/octet-stream` is 415. Type, extension and
          content are then checked against one another asynchronously (`rejected{type_mismatch}`).
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary, description: The file bytes; Content-Type and filename as described above. }
                purpose: { type: string, enum: [input] }
                session_id: { type: string }
            encoding:
              file:
                contentType: image/png, image/jpeg, image/webp, image/gif, image/heic, image/heif, application/pdf, text/markdown, text/plain
      x-noema-error-codes: [schema_violation, invalid_api_key, invalid_end_user_token, permission_denied, session_not_found,
                            idempotency_key_reused, request_too_large, file_too_large, unsupported_media_type, feature_not_available,
                            rpm_exceeded, internal_error]
