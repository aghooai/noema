      responses:
        '200':
          description: |
            SSE stream of FileObject snapshots. Each frame is `id: <n>` (1, 2, … per stream), `event: file.updated` and one
            line of `data: <FileObject JSON>`. The first frame is the current snapshot; the server closes the stream after the
            first snapshot whose status is `ready`, `rejected`, `failed` or `deleted`, or `partial` with no pending derivative
            (a `partial` file with OCR pending keeps streaming until it is `ready`). A `: ping` comment is sent whenever no
            frame was written for 15 s.
